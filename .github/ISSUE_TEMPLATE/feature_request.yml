name: Feature request
description: Propose a new capability or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, and why does it matter?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
      description: >-
        What would this actually cover? Smaller, focused proposals get picked up
        faster — see CONTRIBUTING.md.
    validations:
      required: false

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 860" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Diagram titled How NexusMem works. Git commits, shell commands with their real exit codes, docs, and GitHub threads on your machine flow into NexusMem, a local SQLite index using BM25 plus vector search, with no cloud and no telemetry. NexusMem returns a ranked, token-budgeted slice of that history, so when your coding agent is asked a question, its answer cites the real commit, exit code, and pull request instead of guessing.">

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40,0 H0 V40" fill="none" stroke="#1c1e23" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="0%" r="65%">
      <stop offset="0%" stop-color="#4ade9a" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#4ade9a" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8f97"/>
    </marker>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade9a"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <g id="ic-commit">
      <line x1="0" y1="12" x2="8" y2="12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      <line x1="16" y1="12" x2="24" y2="12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      <circle cx="12" cy="12" r="4.2" fill="#16181c" stroke="currentColor" stroke-width="1.7"/>
    </g>
    <g id="ic-term">
      <rect x="1" y="3" width="22" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <polyline points="6,9 10.5,12 6,15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="12.5" y1="15" x2="17.5" y2="15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <g id="ic-doc">
      <path d="M5,2 H14 L19,7 V22 H5 Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <polyline points="14,2 14,7 19,7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <line x1="8" y1="12" x2="16" y2="12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="8" y1="16" x2="14" y2="16" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    </g>
    <g id="ic-thread">
      <rect x="1.5" y="3" width="21" height="14.5" rx="4" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <line x1="7" y1="8.5" x2="17" y2="8.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="7" y1="12.5" x2="13" y2="12.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    </g>
    <g id="ic-lock">
      <rect x="3.5" y="7.5" width="9" height="7" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path d="M5.3,7.5 V5.6 A2.7,2.7 0 0 1 10.7,5.6 V7.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
    </g>
    <g id="ic-db">
      <ellipse cx="21" cy="10" rx="16" ry="6.5" fill="none" stroke="url(#brandGrad)" stroke-width="2"/>
      <path d="M5,10 V32 A16,6.5 0 0 0 37,32 V10" fill="none" stroke="url(#brandGrad)" stroke-width="2"/>
      <path d="M5,21 A16,6.5 0 0 0 37,21" fill="none" stroke="url(#brandGrad)" stroke-width="1.4" opacity="0.6"/>
    </g>
  </defs>

  <rect x="0" y="0" width="1240" height="860" fill="#0a0b0d"/>
  <rect x="0" y="0" width="1240" height="860" fill="url(#grid)"/>
  <rect x="0" y="0" width="1240" height="480" fill="url(#glow)"/>

  <!-- header -->
  <text x="40" y="54" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="2" fill="#8a8f97">HOW IT WORKS</text>
  <text x="38" y="98" font-size="34" font-weight="700" fill="#edeef0">Real history in.</text>
  <text x="38" y="138" font-size="34" font-weight="700" fill="#edeef0">Grounded answers <tspan fill="url(#brandGrad)">out.</tspan></text>

  <text x="40" y="176" font-size="15.5" fill="#a6abb3">NexusMem watches what actually happened in your project, indexes it</text>
  <text x="40" y="198" font-size="15.5" fill="#a6abb3">locally, and hands your coding agent exactly the slice of that history a</text>
  <text x="40" y="220" font-size="15.5" fill="#a6abb3">question needs &#8212; instead of a guess.</text>

  <!-- diagram -->
  <g transform="translate(0,250)">

    <text x="60" y="46" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="1.5" fill="#8a8f97">1 &#183; WHAT HAPPENED</text>
    <text x="530" y="46" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="1.5" fill="#8a8f97">2 &#183; LOCAL MEMORY</text>
    <text x="890" y="46" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="1.5" fill="#8a8f97">3 &#183; WHAT YOUR AGENT SEES</text>

    <!-- column 1: sources card -->
    <rect x="40" y="70" width="340" height="340" rx="12" fill="#16181c" stroke="#26292f" stroke-width="1.5"/>

    <g transform="translate(64,98)" color="#a6abb3"><use href="#ic-commit" width="24" height="24"/></g>
    <text x="100" y="112" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" fill="#edeef0"><tspan fill="#38bdf8">4f2a91c</tspan> fix(auth): refresh token</text>
    <text x="100" y="130" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" letter-spacing="1" fill="#8a8f97">GIT COMMIT</text>

    <g transform="translate(64,164)" color="#a6abb3"><use href="#ic-term" width="24" height="24"/></g>
    <text x="100" y="178" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" fill="#edeef0">npm run build</text>
    <rect x="270" y="166" width="52" height="20" rx="4" fill="rgba(245,166,35,0.12)" stroke="#f5a623" stroke-width="1"/>
    <text x="296" y="180" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#f5a623">exit 1</text>
    <text x="100" y="196" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" letter-spacing="1" fill="#8a8f97">SHELL &#183; REAL EXIT CODE</text>

    <g transform="translate(64,230)" color="#a6abb3"><use href="#ic-doc" width="24" height="24"/></g>
    <text x="100" y="244" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" fill="#edeef0">README.md &#8250; Setup</text>
    <text x="100" y="262" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" letter-spacing="1" fill="#8a8f97">DOCS</text>

    <g transform="translate(64,296)" color="#a6abb3"><use href="#ic-thread" width="24" height="24"/></g>
    <text x="100" y="308" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" fill="#edeef0">#42 login redirect loop</text>
    <text x="100" y="326" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" letter-spacing="1" fill="#8a8f97">GITHUB ISSUE / PR</text>

    <text x="425" y="230" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#8a8f97">indexed on</text>
    <text x="425" y="244" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#8a8f97">every commit</text>
    <line x1="384" y1="256" x2="454" y2="256" stroke="#8a8f97" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- column 2: NexusMem core -->
    <rect x="470" y="150" width="300" height="180" rx="14" fill="#121417" stroke="url(#brandGrad)" stroke-width="1.6"/>
    <g transform="translate(600,170)" color="#4ade9a"><use href="#ic-db" width="42" height="42"/></g>
    <text x="620" y="242" text-anchor="middle" font-size="19" font-weight="600" fill="#edeef0">NexusMem</text>
    <text x="620" y="264" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#a6abb3">local SQLite &#183; BM25 + vector</text>
    <line x1="500" y1="282" x2="740" y2="282" stroke="#26292f" stroke-width="1"/>
    <g transform="translate(568,292)" color="#8a8f97"><use href="#ic-lock" width="16" height="16"/></g>
    <text x="592" y="304" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#8a8f97">no cloud &#183; no telemetry</text>

    <text x="805" y="230" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#8a8f97">ranked, token-</text>
    <text x="805" y="244" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#8a8f97">budgeted context</text>
    <line x1="774" y1="256" x2="844" y2="256" stroke="#8a8f97" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- column 3: agent Q&A -->
    <rect x="860" y="90" width="340" height="320" rx="12" fill="#16181c" stroke="#26292f" stroke-width="1.5"/>

    <text x="884" y="122" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" letter-spacing="1" fill="#8a8f97">YOU ASK</text>
    <rect x="884" y="132" width="292" height="46" rx="8" fill="#121417" stroke="#26292f" stroke-width="1"/>
    <text x="900" y="160" font-size="13.5" fill="#edeef0">&#8220;why did login redirect-loop</text>
    <text x="900" y="176" font-size="13.5" fill="#edeef0">after deploy?&#8221;</text>

    <text x="884" y="206" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" letter-spacing="1" fill="#4ade9a">NEXUSMEM-GROUNDED ANSWER</text>
    <rect x="884" y="216" width="292" height="70" rx="8" fill="#121417" stroke="#4ade9a" stroke-width="1.2"/>
    <text x="900" y="240" font-size="13.5" fill="#edeef0">npm run build failed (exit 1)</text>
    <text x="900" y="258" font-size="13.5" fill="#edeef0">right before 4f2a91c &#8212; PR #42</text>
    <text x="900" y="276" font-size="13.5" fill="#edeef0">fixed it.</text>

    <text x="884" y="312" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" letter-spacing="1" fill="#8a8f97">CITED, NOT GUESSED</text>
    <rect x="884" y="322" width="78" height="24" rx="12" fill="none" stroke="#383c44" stroke-width="1"/>
    <text x="923" y="338" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#a6abb3">4f2a91c</text>
    <rect x="970" y="322" width="66" height="24" rx="12" fill="none" stroke="#383c44" stroke-width="1"/>
    <text x="1003" y="338" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#a6abb3">exit 1</text>
    <rect x="1044" y="322" width="52" height="24" rx="12" fill="none" stroke="#383c44" stroke-width="1"/>
    <text x="1070" y="338" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#a6abb3">#42</text>

  </g>

  <!-- caption -->
  <text x="40" y="700" font-size="13.5" fill="#a6abb3">NexusMem indexes git commits, shell commands with their real exit codes,</text>
  <text x="40" y="720" font-size="13.5" fill="#a6abb3">docs, and GitHub threads on your machine &#8212; then serves a ranked, token-</text>
  <text x="40" y="740" font-size="13.5" fill="#a6abb3">budgeted slice of that history to your coding agent on request, so its</text>
  <text x="40" y="760" font-size="13.5" fill="#a6abb3">answer cites <tspan font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#edeef0">4f2a91c</tspan> and <tspan font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#edeef0">#42</tspan> instead of guessing.</text>

  <line x1="40" y1="790" x2="1200" y2="790" stroke="#26292f" stroke-width="1"/>
  <text x="40" y="814" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#8a8f97">Local SQLite on disk &#183; <tspan fill="#4ade9a" font-weight="600">no cloud</tspan> &#183; <tspan fill="#4ade9a" font-weight="600">no telemetry</tspan></text>

</svg>
